apiVersion: apps/v1
kind: Deployment
metadata:
  name: safer-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safer-web
  template:
    metadata:
      labels:
        app: safer-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:1.27
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
            - containerPort: 80
